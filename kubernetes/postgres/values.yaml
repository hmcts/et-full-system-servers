# Local development credentials only; never point applications at production.
image: postgres:15
imagePullPolicy: IfNotPresent
username: postgres
password: local-only
storage:
  size: 5Gi
  # Empty uses the cluster's default dynamic provisioner.
  storageClass: ""
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
