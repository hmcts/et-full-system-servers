apiVersion: v1
kind: Service
metadata:
  name: azurite
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: et-local-azurite
  ports:
    - name: blob
      port: 10000
      targetPort: blob
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azurite
spec:
  serviceName: azurite
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: et-local-azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: et-local-azurite
    spec:
      containers:
        - name: azurite
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [azurite-blob, --blobHost, "0.0.0.0", --disableProductStyleUrl, -l, /data]
          env:
            - name: AZURITE_ACCOUNTS
              value: {{ printf "%s:%s" .Values.account .Values.key | quote }}
            - name: BLOB_ACCOUNT
              value: {{ .Values.account | quote }}
            - name: BLOB_KEY
              value: {{ .Values.key | quote }}
            - name: BLOB_CONTAINERS
              value: {{ .Values.containers | toJson | quote }}
          ports:
            - name: blob
              containerPort: 10000
          readinessProbe:
            tcpSocket:
              port: blob
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  # Claims remain when the StatefulSet or Helm release is removed.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
