apiVersion: v1
kind: Service
metadata:
  name: fake-services
spec:
  selector:
    app.kubernetes.io/name: et-local-fake-services
  ports:
    - {name: acas, port: 9000, targetPort: 9000}
    - {name: ccd, port: 9100, targetPort: 9100}
    - {name: notify, port: 9200, targetPort: 9200}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: et-local-fake-services
  template:
    metadata:
      labels:
        app.kubernetes.io/name: et-local-fake-services
    spec:
      containers:
        - name: fake-services
          image: {{ .Values.fakeServices.image | quote }}
          imagePullPolicy: {{ .Values.fakeServices.imagePullPolicy }}
          command: ["./bin/foreman", "start", "--port", "9000"]
          ports:
            - {name: acas, containerPort: 9000}
            - {name: ccd, containerPort: 9100}
            - {name: notify, containerPort: 9200}
          readinessProbe: &ready
            exec:
              command: ["sh", "-c", "nc -z 127.0.0.1 9000 && nc -z 127.0.0.1 9100 && nc -z 127.0.0.1 9200"]
            periodSeconds: 5
            timeoutSeconds: 3
          startupProbe:
            <<: *ready
            failureThreshold: 36
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mailhog
spec:
  selector:
    app.kubernetes.io/name: et-local-mailhog
  ports:
    - {name: smtp, port: 1025, targetPort: smtp}
    - {name: web, port: 8025, targetPort: web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: et-local-mailhog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: et-local-mailhog
    spec:
      containers:
        - name: mailhog
          image: {{ .Values.mailhog.image | quote }}
          imagePullPolicy: {{ .Values.mailhog.imagePullPolicy }}
          env:
            - {name: MH_API_BIND_ADDR, value: "0.0.0.0:8025"}
            - {name: MH_SMTP_BIND_ADDR, value: "0.0.0.0:1025"}
            - {name: MH_UI_BIND_ADDR, value: "0.0.0.0:8025"}
          ports:
            - {name: smtp, containerPort: 1025}
            - {name: web, containerPort: 8025}
          readinessProbe:
            httpGet: {path: /api/v2/messages, port: web}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: "500m", memory: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-services
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: {{ .Values.ingressClass | quote }}
  rules:
  {{- range $route := list (dict "host" "mail" "service" "mailhog" "port" 8025) (dict "host" "acas" "service" "fake-services" "port" 9000) (dict "host" "et-ccd" "service" "fake-services" "port" 9100) (dict "host" "notify" "service" "fake-services" "port" 9200) }}
    - host: {{ printf "%s.%s" $route.host $.Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $route.service }}
                port:
                  number: {{ $route.port }}
  {{- end }}
